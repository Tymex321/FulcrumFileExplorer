[package]
name = "fulcrum"
description = "Fulcrum — a fast file explorer for Windows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# Tauri 2 builds the app as a library so the same code can target desktop and mobile;
# main.rs is a thin shim that calls into it.
name = "fulcrum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
fx-core.workspace = true
fx-index.workspace = true
fx-fs.workspace = true
tauri.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
parking_lot.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
